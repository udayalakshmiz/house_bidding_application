services:
  # Spring Boot Backend Web Service
  - type: web
    name: house-auction-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "https://house-auction-frontend.onrender.com,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://house-auction-frontend.onrender.com"
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: web
    name: house-auction-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://house-auction-backend.onrender.com/api"
      - key: VITE_SERVER_BASE_URL
        value: "https://house-auction-backend.onrender.com"
      - key: VITE_WS_BASE_URL
        value: "https://house-auction-backend.onrender.com/ws-auction"
