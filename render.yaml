services:
  # Spring Boot Backend Service
  - type: web
    name: house-auction-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    disk:
      name: uploads-disk
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: house-auction-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://house-auction-frontend.onrender.com,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://house-auction-frontend.onrender.com"
      - key: FILE_UPLOAD_DIR
        value: "/app/uploads"
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Service
  - type: web
    name: house-auction-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://house-auction-backend.onrender.com/api"
      - key: VITE_SERVER_BASE_URL
        value: "https://house-auction-backend.onrender.com"
      - key: VITE_WS_BASE_URL
        value: "https://house-auction-backend.onrender.com/ws-auction"

databases:
  - name: house-auction-db
    databaseName: house_auction_db
    user: house_user
    plan: free
